name: Сборка Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Установка зависимостей
        run: npm install

      - name: Подготовка веб-файлов
        run: node scripts/prepare-www.js

      - name: Создание Android-проекта
        run: npx cap add android

      - name: Иконки и заставка
        run: npx @capacitor/assets generate --android

      - name: Донастройка Android-проекта
        run: node scripts/patch-android.js

      - name: Синхронизация
        run: npx cap sync android

      - name: Сборка отладочного APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Сохранить отладочный APK
        uses: actions/upload-artifact@v4
        with:
          name: TwixxerChat-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Подписанная версия собирается, только если в настройках репозитория заданы секреты (см. README)
      - name: Сборка релизного APK
        if: env.KS_B64 != ''
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Подпись релизного APK
        if: env.KS_B64 != ''
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KS_PASS --out TwixxerChat-release.apk "$RUNNER_TEMP/aligned.apk"

      - name: Сохранить подписанный APK
        if: env.KS_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: TwixxerChat-release-apk
          path: TwixxerChat-release.apk
